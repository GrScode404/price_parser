[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "price-parser"
version = "0.1.0"
description = "Asynchronous product price parser"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiohttp==3.14.3",
    "lxml==6.1.3",
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff (>=0.16.10,<0.17.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "lxml-stubs (>=0.5.1,<0.6.0)",
]

[tool.poetry]
packages = [
    { include = "price_parser", from = "src" },
]
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/price_parser"]